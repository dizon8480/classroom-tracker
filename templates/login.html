<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCT Colleges Cainta - Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { width: 440px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        .form-control { border-radius: 10px; border: 2px solid #cbd5e1; padding: 12px; }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        .input-group .form-control { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none; }
        .input-group .form-control:focus { box-shadow: none; border-color: #6366f1; }
        .input-group:focus-within { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); border-radius: 10px; }
        .input-group .btn-outline-secondary { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border: 2px solid #cbd5e1; border-left: none; background-color: #ffffff; color: #64748b; padding: 0 16px; }
        .input-group .btn-outline-secondary:hover { background-color: #f8fafc; color: #4f46e5; border-color: #6366f1; }
        .btn-cute { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 12px; color: #ffffff; font-weight: 700; padding: 12px; transition: all 0.3s ease; }
        .btn-cute:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3); color: #ffffff; }
        .demo-box { background: #f8fafc; border: 2px dashed #a5b4fc; border-radius: 14px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <div class="fs-1 mb-2">🎓✨</div>
            <h3 class="fw-bold text-dark mb-1">ICCT Colleges Cainta</h3>
            <p class="text-muted small mb-0">Classroom Data Tracker Portal</p>
        </div>

        <div id="error-alert" class="alert alert-danger d-none py-2 px-3 small text-center rounded-3" role="alert"></div>

        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-secondary">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="off">
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-cute w-100 mt-2">💖 Authenticate & Enter Portal</button>
        </form>

        <div class="demo-box mt-4 p-3 text-start small">
            <div class="fw-bold mb-2" style="color: #4f46e5;">🌸 Quick Demo Accounts:</div>
            <div class="text-dark">
                👨‍🏫 <strong>Educator:</strong> <code class="fw-bold text-primary">educator</code> / <code class="fw-bold text-primary">icct2026</code><br>
                🎓 <strong>Student:</strong> <code class="fw-bold text-primary">student_juan</code> / <code class="fw-bold text-primary">student123</code><br>
                👪 <strong>Parent:</strong> <code class="fw-bold text-primary">parent_cruz</code> / <code class="fw-bold text-primary">parent123</code>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');

            errorAlert.classList.add('d-none');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    window.location.href = result.redirect;
                } else {
                    errorAlert.textContent = result.message || 'Invalid username or password.';
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.textContent = 'Network or server error occurred. Ensure app.py is running.';
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
